version: "3.8"

services:
  app:
    build: .
    container_name: laravel-app
    restart: always
    ports:
      - "8000:9000"
    volumes:
      - ./backend:/var/www/html
      - ./frontend:/var/www/html/frontend
    environment:
      - DB_CONNECTION=pgsql
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_DATABASE=note_proj
      - DB_USERNAME=postgres
      - DB_PASSWORD=Samoilov030! # Исправьте пароль здесь
    depends_on:
      - postgres
    networks:
      - app-network

  postgres:
    image: postgres:15-alpine
    container_name: laravel-postgres
    restart: always
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_DB=note_proj # Исправьте название БД
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=Samoilov030! # Пароль должен совпадать с app
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - app-network

  nginx:
    image: nginx:alpine
    container_name: laravel-nginx
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./backend/public:/var/www/html/public
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app
    networks:
      - app-network

networks:
  app-network:
    driver: bridge

volumes:
  postgres_data:
